<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page of Playing Cards</title>
    <style>
        body {
            background-color: #2c5f2d;
            font-family: 'Georgia', serif;
            padding: 40px 20px;
            min-height: 100vh;
        }

        /* Container utama untuk kartu */
        #playing-cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Setiap kartu */
        .card {
            width: 180px;
            height: 260px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
        }

        /* Bagian kiri kartu (pojok kiri atas) */
        .left {
            align-self: flex-start;
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
        }

        /* Bagian tengah kartu (simbol besar) */
        .middle {
            align-self: center;
            display: flex;
            flex-direction: column;
            font-size: 70px;
            line-height: 1;
        }

        /* Bagian kanan kartu (pojok kanan bawah, dibalik) */
        .right {
            align-self: flex-end;
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
            transform: rotate(180deg);
        }

        /* Warna merah untuk kartu hati dan wajik */
        .red {
            color: #d32f2f;
        }

        /* Warna hitam untuk kartu sekop dan keriting */
        .black {
            color: #1a1a1a;
        }
    </style>
</head>
<body>

    <main id="playing-cards">
        <!-- Kartu 1: Ace of Spades -->
        <div class="card black">
            <div class="left">A<br>♠</div>
            <div class="middle"><span>♠</span></div>
            <div class="right">A<br>♠</div>
        </div>

        <!-- Kartu 2: 10 of Hearts -->
        <div class="card red">
            <div class="left">10<br>♥</div>
            <div class="middle"><span>♥</span></div>
            <div class="right">10<br>♥</div>
        </div>

        <!-- Kartu 3: King of Diamonds -->
        <div class="card red">
            <div class="left">K<br>♦</div>
            <div class="middle"><span>♦</span></div>
            <div class="right">K<br>♦</div>
        </div>

        <!-- Kartu 4: 7 of Clubs (bonus!) -->
        <div class="card black">
            <div class="left">7<br>♣</div>
            <div class="middle"><span>♣</span></div>
            <div class="right">7<br>♣</div>
        </div>
    </main>

</body>
</html>
